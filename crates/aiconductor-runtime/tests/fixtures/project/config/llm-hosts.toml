# Sanitized test fixture mirroring the deployment configuration. No real hosts,
# users or paths. Route, capability and workflow files must match the deployment.
schema_version = 1
default_orchestrator = "qwen3-4b-p2000"

[hosts.local]
ssh_target = ""

[hosts.ai_10]
ssh_target = "user@ai-10.example"

[hosts.ai_10.tunnel]
local_host = "127.0.0.1"
local_port = 18080
remote_host = "127.0.0.1"
remote_port = 8080

[hosts.ai_20]
ssh_target = "user@ai-20.example"

[[launch_profiles]]
id = "qwen3-4b-p2000"
host = "local"
model = "/models/qwen3-4b-p2000.gguf"
launch_script = "/opt/example/bin/start-qwen3-4b-p2000"
status = "installed"
api_base = "http://127.0.0.1:8080"
modality = "text"
exclusive_group = "local_llama_gpu"

